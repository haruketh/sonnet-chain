[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sonnet-chain"
version = "0.1.0"
description = "Saruku participant runtime for FLOP Labs Technocore Sonnet Challenge"
requires-python = ">=3.12"
dependencies = [
  "cryptography>=43",
  "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
]

[project.scripts]
sonnet-chain = "sonnet_chain.cli:main"
sonnet-chain-x-publisher = "sonnet_chain.x_publisher_adapter:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
